<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Furry Character Gallery</title>

<style>

/* =========================================================
   基础
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background: #111;

    color: #fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        sans-serif;

    /*
     * 防止移动浏览器上下滑动时产生
     * overscroll / 橡皮筋效果。
     */
    overscroll-behavior-y: none;
}

body {
    overflow-x: hidden;
    position: relative;
}


/* =========================================================
   独立固定背景层
   ========================================================= */

/*
 * 使用独立 fixed 层，而不是 background-attachment: fixed。
 *
 * 注意：
 *
 * 这里故意不使用 transform: translateZ(0)。
 *
 * 某些 Android / iOS 移动浏览器会因为
 * translateZ(0) 创建独立合成层，
 * 导致页面上下滑动时背景跟着移动，
 * 松手后又弹回原位置。
 */

#background-layer {
    position: fixed;

    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    z-index: 0;
    pointer-events: none;

    background-image:
        linear-gradient(
            rgba(0,0,0,0.68),
            rgba(0,0,0,0.68)
        ),
        url("background.gif");

    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
}


/*
 * 所有实际页面内容放在背景层上面。
 */

header,
#search-area,
#statistics,
#loading,
#error,
#no-results,
#characters {
    position: relative;
    z-index: 1;
}


/* =========================================================
   顶部
   ========================================================= */

header {
    width: 100%;

    padding:
        30px
        40px
        20px;

    text-align: center;
}

header h1 {
    margin: 0;

    font-size: 32px;

    font-weight: 700;

    letter-spacing: 1px;
}

header p {
    margin:
        8px
        0
        0;

    color: #aaa;

    font-size: 14px;
}


/* =========================================================
   搜索区域
   ========================================================= */

#search-area {
    width: 100%;

    max-width: 900px;

    margin:
        10px
        auto
        20px;

    padding:
        0
        30px;
}


/*
 * 搜索栏整体。
 */

#search-panel {
    width: 100%;

    padding:
        6px
        8px;

    border:
        1px solid
        rgba(255,255,255,0.15);

    border-radius: 10px;

    background:
        rgba(20,20,20,0.88);

    transition:
        border-color 0.2s,
        box-shadow 0.2s;
}

#search-panel:focus-within {
    border-color:
        rgba(255,255,255,0.35);

    box-shadow:
        0 0 15px
        rgba(255,255,255,0.06);
}


/*
 * 点击标签后出现的搜索标签。
 */

#selected-tags {
    display: flex;

    flex-wrap: wrap;

    gap: 6px;

    padding:
        3px
        3px
        5px;
}

.search-tag {
    display: inline-flex;

    align-items: center;

    gap: 5px;

    padding:
        5px
        9px;

    border-radius: 999px;

    background:
        rgba(255,255,255,0.13);

    color: #eee;

    font-size: 13px;

    line-height: 1;

    white-space: nowrap;
}

.search-tag-close {
    width: 16px;
    height: 16px;

    padding: 0;

    border: none;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.12);

    color: #bbb;

    font-size: 13px;

    line-height: 16px;

    cursor: pointer;

    display: inline-flex;

    align-items: center;
    justify-content: center;
}

.search-tag-close:hover {
    background:
        rgba(255,255,255,0.25);

    color: white;
}


/*
 * 实际输入框。
 */

#search-box {
    width: 100%;

    padding:
        9px
        10px;

    border: none;

    outline: none;

    background: transparent;

    color: white;

    font-size: 15px;
}

#search-box::placeholder {
    color: #777;
}

#search-info {
    margin-top: 9px;

    color: #777;

    font-size: 12px;

    text-align: center;
}


/* =========================================================
   总统计
   ========================================================= */

#statistics {
    text-align: center;

    color: #888;

    font-size: 13px;

    margin-bottom: 10px;
}


/* =========================================================
   角色列表
   ========================================================= */

#characters {
    width: 100%;

    max-width: 1400px;

    margin: 0 auto;

    padding:
        20px
        30px
        60px;
}

.character {
    margin-bottom: 50px;

    transition:
        opacity 0.3s ease,
        transform 0.3s ease,
        max-height 0.35s ease,
        margin 0.35s ease;

    max-height: 1400px;
}

.character.filtered-out {
    opacity: 0;

    transform:
        scale(0.96);

    max-height: 0;

    overflow: hidden;

    margin-bottom: 0;

    pointer-events: none;
}


/* =========================================================
   角色标题
   ========================================================= */

.character-title {
    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;

    margin-bottom: 8px;
}

.character-title h2 {
    margin: 0;

    font-size: 24px;

    line-height: 1.3;
}

.character-count {
    flex-shrink: 0;

    color: #888;

    font-size: 13px;
}


/* =========================================================
   角色简介
   ========================================================= */

.character-description {
    margin:
        0
        0
        10px;

    color: #aaa;

    font-size: 14px;

    line-height: 1.6;
}


/* =========================================================
   角色 Tags
   ========================================================= */

.character-tags {
    display: flex;

    flex-wrap: wrap;

    gap: 7px;

    margin-bottom: 15px;
}

.character-tag {
    padding:
        5px
        10px;

    border:
        1px solid
        rgba(255,255,255,0.10);

    border-radius: 999px;

    background:
        rgba(0,0,0,0.38);

    color: #bbb;

    font-size: 12px;

    line-height: 1;

    cursor: pointer;

    transition:
        background 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease,
        transform 0.2s ease;
}

.character-tag:hover {
    background:
        rgba(255,255,255,0.15);

    border-color:
        rgba(255,255,255,0.25);

    color: white;

    transform:
        translateY(-1px);
}


/* =========================================================
   横向画廊
   ========================================================= */

.gallery-wrapper {
    position: relative;

    width: 100%;
}

.gallery {
    display: flex;

    gap: 16px;

    overflow-x: auto;

    overflow-y: hidden;

    padding:
        5px
        2px
        15px;

    scroll-behavior: smooth;

    scrollbar-width: thin;

    scrollbar-color:
        #555
        #222;

    cursor: grab;

    /*
     * 保持触摸设备上的横向滑动，
     * 同时允许正常的页面上下滚动。
     */
    touch-action: pan-x pan-y;
}

.gallery:active {
    cursor: grabbing;
}

.gallery::-webkit-scrollbar {
    height: 8px;
}

.gallery::-webkit-scrollbar-track {
    background: #222;

    border-radius: 10px;
}

.gallery::-webkit-scrollbar-thumb {
    background: #555;

    border-radius: 10px;
}

.gallery::-webkit-scrollbar-thumb:hover {
    background: #777;
}


/* =========================================================
   图片卡片
   ========================================================= */

.image-card {
    flex:
        0
        0
        auto;

    width: 260px;

    height: 260px;

    background: #1c1c1c;

    border-radius: 12px;

    overflow: hidden;

    position: relative;

    cursor: pointer;

    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        opacity 0.25s ease;
}

.image-card:hover {
    transform:
        translateY(-6px)
        scale(1.035);

    box-shadow:
        0
        12px
        30px
        rgba(0,0,0,0.55);
}

.image-card img {
    width: 100%;

    height: 100%;

    display: block;

    object-fit: contain;

    background: #181818;
}

.image-number {
    position: absolute;

    left: 10px;

    bottom: 10px;

    padding:
        4px
        8px;

    background:
        rgba(0,0,0,0.65);

    border-radius: 6px;

    font-size: 12px;

    color: #ddd;

    pointer-events: none;
}


/* =========================================================
   搜索隐藏图片
   ========================================================= */

.image-card.search-hidden {
    display: none;
}


/* =========================================================
   左右滚动按钮
   ========================================================= */

.scroll-button {
    position: absolute;

    top: 50%;

    transform:
        translateY(-50%);

    width: 42px;

    height: 42px;

    border: none;

    border-radius: 50%;

    background:
        rgba(0,0,0,0.75);

    color: white;

    font-size: 24px;

    cursor: pointer;

    z-index: 5;

    display: flex;

    align-items: center;

    justify-content: center;

    transition:
        background 0.2s ease;
}

.scroll-button:hover {
    background:
        rgba(255,255,255,0.2);
}

.scroll-left {
    left: 10px;
}

.scroll-right {
    right: 10px;
}


/* =========================================================
   Lightbox
   ========================================================= */

#lightbox {
    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,0.92);

    z-index: 9999;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 50px;
}

#lightbox.active {
    display: flex;
}

#lightbox-image {
    max-width: 95vw;

    max-height: 90vh;

    object-fit: contain;

    border-radius: 6px;

    user-select: none;
}

.lightbox-close {
    position: fixed;

    top: 20px;

    right: 25px;

    width: 45px;

    height: 45px;

    border: none;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.1);

    color: white;

    font-size: 30px;

    cursor: pointer;

    z-index: 10001;
}

.lightbox-close:hover {
    background:
        rgba(255,255,255,0.2);
}

.lightbox-button {
    position: fixed;

    top: 50%;

    transform:
        translateY(-50%);

    width: 55px;

    height: 70px;

    border: none;

    background:
        rgba(0,0,0,0.5);

    color: white;

    font-size: 40px;

    cursor: pointer;

    z-index: 10001;
}

.lightbox-button:hover {
    background:
        rgba(255,255,255,0.15);
}

.lightbox-prev {
    left: 15px;
}

.lightbox-next {
    right: 15px;
}

#lightbox-info {
    position: fixed;

    bottom: 20px;

    left: 50%;

    transform:
        translateX(-50%);

    padding:
        7px
        14px;

    border-radius: 8px;

    background:
        rgba(0,0,0,0.65);

    color: #ddd;

    font-size: 13px;

    z-index: 10001;

    white-space: nowrap;
}


/* =========================================================
   加载 / 错误
   ========================================================= */

#loading {
    text-align: center;

    padding: 80px 20px;

    color: #888;

    font-size: 15px;
}

#error {
    display: none;

    max-width: 700px;

    margin: 50px auto;

    padding: 20px;

    background: #251818;

    border:
        1px solid
        #633;

    border-radius: 10px;

    color: #eaa;
}

#no-results {
    display: none;

    text-align: center;

    padding: 70px 20px;

    color: #777;

    font-size: 15px;
}


/* =========================================================
   手机适配
   ========================================================= */

@media (max-width: 700px) {

    /*
     * 移动端进一步禁止纵向 overscroll。
     */

    html,
    body {
        overscroll-behavior-y: none;
    }

    /*
     * 手机端背景保持固定在视觉区域中央。
     */

    #background-layer {
        width: 100vw;
        height: 100vh;

        top: 0;
        left: 0;

        background-position: center center;
    }


    header {
        padding:
            25px
            20px
            15px;
    }

    header h1 {
        font-size: 25px;
    }

    #search-area {
        padding:
            0
            15px;
    }

    #characters {
        padding:
            15px
            15px
            40px;
    }

    .character {
        margin-bottom: 35px;
    }

    .character-title {
        align-items: flex-start;
    }

    .character-title h2 {
        font-size: 20px;
    }

    .character-count {
        font-size: 12px;
    }

    .character-description {
        font-size: 13px;
    }

    .image-card {
        width: 200px;

        height: 200px;
    }

    .scroll-button {
        display: none;
    }

    #lightbox {
        padding: 20px;
    }

    .lightbox-button {
        width: 40px;

        height: 60px;

        font-size: 28px;
    }

    .lightbox-prev {
        left: 5px;
    }

    .lightbox-next {
        right: 5px;
    }

    #lightbox-info {
        max-width: 80vw;

        overflow: hidden;

        text-overflow: ellipsis;
    }

}

</style>

</head>


<body>

<!-- =====================================================
     固定背景
     ===================================================== -->

<div id="background-layer"></div>


<header>

    <h1>
        Furry Character Gallery
    </h1>

    <p>
        Merphy's Character Gallery
    </p>

</header>


<!-- =====================================================
     搜索框
     ===================================================== -->

<div id="search-area">

    <div id="search-panel">

        <div id="selected-tags"></div>

        <input
            id="search-box"
            type="text"
            placeholder="搜索角色名、英文名、昵称、标签或图片编号"
            autocomplete="off"
        >

    </div>

    <div id="search-info">
        支持中文、英文、昵称、标签和精确图片编号；点击标签可加入筛选
    </div>

</div>


<!-- =====================================================
     总统计
     ===================================================== -->

<div id="statistics"></div>


<!-- =====================================================
     加载 / 错误 / 无结果
     ===================================================== -->

<div id="loading">
    正在读取图库……
</div>

<div id="error"></div>

<div id="no-results">
    没有找到符合条件的图片。
</div>


<!-- =====================================================
     角色
     ===================================================== -->

<main id="characters"></main>


<!-- =====================================================
     Lightbox
     ===================================================== -->

<div id="lightbox">

    <button
        class="lightbox-close"
        onclick="closeLightbox()"
        aria-label="关闭"
    >
        ×
    </button>

    <button
        class="lightbox-button lightbox-prev"
        onclick="previousImage()"
        aria-label="上一张"
    >
        ‹
    </button>

    <img
        id="lightbox-image"
        src=""
        alt="Preview"
    >

    <button
        class="lightbox-button lightbox-next"
        onclick="nextImage()"
        aria-label="下一张"
    >
        ›
    </button>

    <div id="lightbox-info"></div>

</div>


<script>

/* =========================================================
   全局状态
   ========================================================= */

let galleryData = [];

let currentImages = [];

let currentIndex = 0;

let currentCharacterName = "";

let selectedTags = [];


/* =========================================================
   读取 gallery.json
   ========================================================= */

async function loadGallery() {

    const loading =
        document.getElementById(
            "loading"
        );

    const container =
        document.getElementById(
            "characters"
        );

    const error =
        document.getElementById(
            "error"
        );

    try {

        const response =
            await fetch(
                `gallery.json?t=${Date.now()}`
            );

        if (!response.ok) {

            throw new Error(
                `无法读取 gallery.json：${response.status}`
            );

        }

        const data =
            await response.json();

        galleryData =
            Array.isArray(data.characters)
                ? data.characters
                : [];


        galleryData.forEach(
            character => {

                const section =
                    createCharacterGallery(
                        character
                    );

                container.appendChild(
                    section
                );

            }
        );


        updateStatistics();


        loading.style.display =
            "none";


        document
            .getElementById(
                "search-box"
            )
            .addEventListener(
                "input",
                performSearch
            );


        renderSelectedTags();

    } catch (err) {

        console.error(err);

        loading.style.display =
            "none";

        error.style.display =
            "block";

        error.innerHTML = `
            <strong>
                读取图库失败。
            </strong>
            <br><br>
            ${escapeHtml(err.message)}
            <br><br>
            请确认仓库根目录存在
            <strong>gallery.json</strong>，
            并确认 GitHub Actions 已经成功运行。
        `;

    }

}


/* =========================================================
   创建角色画廊
   ========================================================= */

function createCharacterGallery(
    character
) {

    const section =
        document.createElement(
            "section"
        );

    section.className =
        "character";


    /*
     * =====================================================
     * 标题
     * =====================================================
     */

    const title =
        document.createElement(
            "div"
        );

    title.className =
        "character-title";


    const heading =
        document.createElement(
            "h2"
        );

    heading.textContent =
        formatCharacterName(character);


    const count =
        document.createElement(
            "span"
        );

    count.className =
        "character-count";

    count.textContent =
        `${character.images.length} 张图片`;


    title.appendChild(
        heading
    );

    title.appendChild(
        count
    );

    section.appendChild(
        title
    );


    /*
     * =====================================================
     * 角色简介
     * =====================================================
     */

    if (character.description) {

        const description =
            document.createElement(
                "div"
            );

        description.className =
            "character-description";

        description.textContent =
            character.description;

        section.appendChild(
            description
        );

    }


    /*
     * =====================================================
     * Tags
     * =====================================================
     */

    if (
        Array.isArray(character.tags) &&
        character.tags.length > 0
    ) {

        const tagContainer =
            document.createElement(
                "div"
            );

        tagContainer.className =
            "character-tags";


        character.tags.forEach(
            tag => {

                const tagButton =
                    document.createElement(
                        "button"
                    );

                tagButton.type =
                    "button";

                tagButton.className =
                    "character-tag";

                tagButton.textContent =
                    `#${tag}`;

                tagButton.title =
                    `搜索标签：${tag}`;


                tagButton.addEventListener(
                    "click",
                    () => {

                        addTagFilter(
                            String(tag)
                        );

                    }
                );


                tagContainer.appendChild(
                    tagButton
                );

            }
        );


        section.appendChild(
            tagContainer
        );

    }


    /*
     * =====================================================
     * 画廊容器
     * =====================================================
     */

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "gallery-wrapper";


    const gallery =
        document.createElement(
            "div"
        );

    gallery.className =
        "gallery";


    /*
     * =====================================================
     * 图片
     * =====================================================
     */

    character.images.forEach(
        (
            imagePath,
            index
        ) => {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "image-card";


            card.dataset.characterId =
                character.id || "";


            card.dataset.filename =
                getFilename(
                    imagePath
                );


            /*
             * 图片
             */

            const img =
                document.createElement(
                    "img"
                );

            img.src =
                imagePath;

            img.alt =
                `${formatCharacterName(character)} ${getFilename(imagePath)}`;

            img.loading =
                "lazy";


            /*
             * 图片编号
             */

            const number =
                document.createElement(
                    "div"
                );

            number.className =
                "image-number";

            number.textContent =
                getFilename(
                    imagePath
                );


            /*
             * 添加元素
             */

            card.appendChild(
                img
            );

            card.appendChild(
                number
            );


            /*
             * 点击打开 Lightbox
             */

            card.addEventListener(
                "click",
                () => {

                    openLightbox(
                        character.images,
                        index,
                        formatCharacterName(character)
                    );

                }
            );


            gallery.appendChild(
                card
            );

        }
    );


    /*
     * =====================================================
     * 左按钮
     * =====================================================
     */

    const leftButton =
        document.createElement(
            "button"
        );

    leftButton.type =
        "button";

    leftButton.className =
        "scroll-button scroll-left";

    leftButton.textContent =
        "‹";

    leftButton.setAttribute(
        "aria-label",
        "向左滚动"
    );


    leftButton.onclick =
        () => {

            gallery.scrollBy({

                left: -700,

                behavior: "smooth"

            });

        };


    /*
     * =====================================================
     * 右按钮
     * =====================================================
     */

    const rightButton =
        document.createElement(
            "button"
        );

    rightButton.type =
        "button";

    rightButton.className =
        "scroll-button scroll-right";

    rightButton.textContent =
        "›";

    rightButton.setAttribute(
        "aria-label",
        "向右滚动"
    );


    rightButton.onclick =
        () => {

            gallery.scrollBy({

                left: 700,

                behavior: "smooth"

            });

        };


    /*
     * =====================================================
     * 组合
     * =====================================================
     */

    wrapper.appendChild(
        leftButton
    );

    wrapper.appendChild(
        gallery
    );

    wrapper.appendChild(
        rightButton
    );

    section.appendChild(
        wrapper
    );


    return section;

}


/* =========================================================
   角色显示名称
   ========================================================= */

function formatCharacterName(
    character
) {

    const name =
        String(
            character.name ||
            character.id ||
            ""
        ).trim();


    const nameEn =
        String(
            character.name_en ||
            ""
        ).trim();


    if (
        name &&
        nameEn &&
        name.toLowerCase() !==
        nameEn.toLowerCase()
    ) {

        return `${name} / ${nameEn}`;

    }


    return name || nameEn;

}


/* =========================================================
   获取文件名
   ========================================================= */

function getFilename(
    path
) {

    return String(path)
        .split("/")
        .pop();

}


/* =========================================================
   获取图片编号
   ========================================================= */

function getImageNumber(
    filename
) {

    const match =
        filename.match(
            /^(\d+)(?:\.[^.]+)?$/i
        );


    if (!match) {

        return null;

    }


    return match[1];

}


/* =========================================================
   文本标准化
   ========================================================= */

function normalizeText(
    value
) {

    return String(
        value ?? ""
    )
        .toLocaleLowerCase()
        .trim();

}


/* =========================================================
   获取角色搜索文本
   ========================================================= */

function getCharacterSearchText(
    character
) {

    const fields = [

        character.name,

        character.name_en,

        ...(Array.isArray(character.aliases)
            ? character.aliases
            : []),

        ...(Array.isArray(character.tags)
            ? character.tags
            : [])

    ];


    return fields
        .map(normalizeText)
        .filter(Boolean)
        .join(" ");

}


/* =========================================================
   Tag 搜索
   ========================================================= */

function addTagFilter(
    tag
) {

    const normalized =
        normalizeText(tag);


    if (!normalized) {

        return;

    }


    const exists =
        selectedTags.some(
            existing =>
                normalizeText(existing) ===
                normalized
        );


    if (!exists) {

        selectedTags.push(
            tag
        );

    }


    renderSelectedTags();

    performSearch();

}


/*
 * 删除单个 Tag。
 */

function removeTagFilter(
    index
) {

    if (
        index < 0 ||
        index >= selectedTags.length
    ) {

        return;

    }


    selectedTags.splice(
        index,
        1
    );


    renderSelectedTags();

    performSearch();

}


/*
 * 绘制搜索栏里的 Tag。
 */

function renderSelectedTags() {

    const container =
        document.getElementById(
            "selected-tags"
        );


    container.innerHTML = "";


    selectedTags.forEach(
        (
            tag,
            index
        ) => {

            const chip =
                document.createElement(
                    "span"
                );

            chip.className =
                "search-tag";


            const text =
                document.createElement(
                    "span"
                );

            text.textContent =
                tag;


            const close =
                document.createElement(
                    "button"
                );

            close.type =
                "button";

            close.className =
                "search-tag-close";

            close.textContent =
                "×";


            close.setAttribute(
                "aria-label",
                `删除标签 ${tag}`
            );


            close.addEventListener(
                "click",
                () => {

                    removeTagFilter(
                        index
                    );

                }
            );


            chip.appendChild(
                text
            );

            chip.appendChild(
                close
            );


            container.appendChild(
                chip
            );

        }
    );

}


/* =========================================================
   搜索
   ========================================================= */

function performSearch() {

    const searchBox =
        document.getElementById(
            "search-box"
        );


    const input =
        searchBox.value.trim();


    const sections =
        document.querySelectorAll(
            ".character"
        );


    const noResults =
        document.getElementById(
            "no-results"
        );


    const searchInfo =
        document.getElementById(
            "search-info"
        );


    /*
     * 自由文字搜索条件
     */

    const textTokens =
        input
            .toLocaleLowerCase()
            .split(/\s+/)
            .filter(Boolean);


    /*
     * 没有任何搜索条件
     */

    if (
        textTokens.length === 0 &&
        selectedTags.length === 0
    ) {

        sections.forEach(
            section => {

                section.classList.remove(
                    "filtered-out"
                );


                const cards =
                    section.querySelectorAll(
                        ".image-card"
                    );


                cards.forEach(
                    card => {

                        card.classList.remove(
                            "search-hidden"
                        );

                    }
                );

            }
        );


        searchInfo.textContent =
            "支持中文、英文、昵称、标签和精确图片编号；点击标签可加入筛选";


        noResults.style.display =
            "none";


        return;

    }


    let visibleImages = 0;

    let visibleCharacters = 0;


    /*
     * 遍历角色
     */

    sections.forEach(
        section => {

            const characterId =
                section
                    .querySelector(
                        ".image-card"
                    )
                    ?.dataset
                    .characterId;


            const character =
                galleryData.find(
                    item =>
                        String(item.id) ===
                        String(characterId)
                );


            if (!character) {

                return;

            }


            /*
             * 角色搜索文本
             */

            const searchText =
                getCharacterSearchText(
                    character
                );


            /*
             * Tag 条件
             */

            const characterTags =
                Array.isArray(character.tags)
                    ? character.tags
                    : [];


            const normalizedCharacterTags =
                characterTags.map(
                    normalizeText
                );


            const tagsMatched =
                selectedTags.every(
                    tag =>
                        normalizedCharacterTags
                            .includes(
                                normalizeText(tag)
                            )
                );


            const cards =
                section.querySelectorAll(
                    ".image-card"
                );


            let characterHasMatch =
                false;


            /*
             * 遍历图片
             */

            cards.forEach(
                card => {

                    const filename =
                        (
                            card.dataset.filename ||
                            ""
                        )
                        .toLocaleLowerCase();


                    const imageNumber =
                        getImageNumber(
                            filename
                        );


                    /*
                     * 每个文字搜索词都必须满足
                     */

                    const textMatched =
                        textTokens.every(
                            token => {

                                /*
                                 * 数字搜索：
                                 *
                                 * 精确匹配图片编号
                                 */

                                if (
                                    /^\d+$/.test(
                                        token
                                    )
                                ) {

                                    return (
                                        imageNumber ===
                                        token
                                    );

                                }


                                /*
                                 * 文字搜索：
                                 *
                                 * 角色名称、
                                 * 英文名、
                                 * aliases、
                                 * tags
                                 */

                                return searchText.includes(
                                    token
                                );

                            }
                        );


                    const matched =
                        tagsMatched &&
                        textMatched;


                    if (matched) {

                        card.classList.remove(
                            "search-hidden"
                        );


                        characterHasMatch =
                            true;


                        visibleImages++;

                    } else {

                        card.classList.add(
                            "search-hidden"
                        );

                    }

                }
            );


            /*
             * 更新角色状态
             */

            if (characterHasMatch) {

                section.classList.remove(
                    "filtered-out"
                );


                visibleCharacters++;

            } else {

                section.classList.add(
                    "filtered-out"
                );

            }

        }
    );


    /*
     * 搜索统计
     */

    searchInfo.textContent =
        `找到 ${visibleCharacters} 个角色，${visibleImages} 张图片`;


    /*
     * 无结果
     */

    if (
        visibleImages === 0
    ) {

        noResults.style.display =
            "block";

    } else {

        noResults.style.display =
            "none";

    }

}


/* =========================================================
   总统计
   ========================================================= */

function updateStatistics() {

    const totalCharacters =
        galleryData.length;


    const totalImages =
        galleryData.reduce(
            (
                total,
                character
            ) => {

                return (
                    total +
                    (
                        Array.isArray(
                            character.images
                        )
                            ? character.images.length
                            : 0
                    )
                );

            },
            0
        );


    document
        .getElementById(
            "statistics"
        )
        .textContent =
        `${totalCharacters} 个角色 · ${totalImages} 张图片`;

}


/* =========================================================
   HTML 转义
   ========================================================= */

function escapeHtml(
    value
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        String(value);


    return div.innerHTML;

}


/* =========================================================
   Lightbox
   ========================================================= */

function openLightbox(
    images,
    index,
    characterName
) {

    currentImages =
        images;


    currentIndex =
        index;


    currentCharacterName =
        characterName;


    updateLightbox();


    document
        .getElementById(
            "lightbox"
        )
        .classList
        .add("active");


    document.body.style.overflow =
        "hidden";

}


function updateLightbox() {

    if (
        !currentImages ||
        currentImages.length === 0
    ) {

        return;

    }


    const image =
        currentImages[
            currentIndex
        ];


    const filename =
        getFilename(
            image
        );


    document
        .getElementById(
            "lightbox-image"
        )
        .src =
        image;


    document
        .getElementById(
            "lightbox-info"
        )
        .textContent =
        `${currentCharacterName} · ${filename} · ${currentIndex + 1} / ${currentImages.length}`;

}


function closeLightbox() {

    document
        .getElementById(
            "lightbox"
        )
        .classList
        .remove("active");


    document.body.style.overflow =
        "";

}


function previousImage() {

    if (
        !currentImages ||
        currentImages.length === 0
    ) {

        return;

    }


    currentIndex--;


    if (
        currentIndex < 0
    ) {

        currentIndex =
            currentImages.length - 1;

    }


    updateLightbox();

}


function nextImage() {

    if (
        !currentImages ||
        currentImages.length === 0
    ) {

        return;

    }


    currentIndex++;


    if (
        currentIndex >=
        currentImages.length
    ) {

        currentIndex = 0;

    }


    updateLightbox();

}


/* =========================================================
   键盘操作
   ========================================================= */

document.addEventListener(
    "keydown",
    event => {

        const lightbox =
            document.getElementById(
                "lightbox"
            );


        if (
            !lightbox.classList.contains(
                "active"
            )
        ) {

            return;

        }


        if (
            event.key ===
            "ArrowLeft"
        ) {

            previousImage();

        }


        if (
            event.key ===
            "ArrowRight"
        ) {

            nextImage();

        }


        if (
            event.key ===
            "Escape"
        ) {

            closeLightbox();

        }

    }
);


/* =========================================================
   点击黑色背景关闭
   ========================================================= */

document
    .getElementById(
        "lightbox"
    )
    .addEventListener(
        "click",
        event => {

            if (
                event.target.id ===
                "lightbox"
            ) {

                closeLightbox();

            }

        }
    );


/* =========================================================
   启动
   ========================================================= */

loadGallery();

</script>
