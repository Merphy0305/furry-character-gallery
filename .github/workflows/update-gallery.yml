name: Update Gallery JSON

on:
  push:
    branches:
      - main
    paths-ignore:
      - gallery.json

permissions:
  contents: write

jobs:
  update-gallery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate gallery.json
        shell: python
        run: |
          import json
          import os

          root = "."
          metadata_file = "characters.json"
          output_file = "gallery.json"

          image_extensions = {
              ".jpg",
              ".jpeg",
              ".png",
              ".webp",
              ".gif"
          }

          ignored_folders = {
              ".git",
              ".github"
          }

          def is_image(filename):
              extension = os.path.splitext(filename)[1].lower()
              return extension in image_extensions

          def image_sort_key(filename):
              name = os.path.splitext(filename)[0]

              if name.isdigit():
                  return (0, int(name))

              return (1, name.lower())

          # ---------------------------------------------------------
          # 读取人工维护的角色资料
          #
          # characters.json 示例：
          #
          # {
          #     "Smolder": {
          #         "name": "斯莫德",
          #         "name_en": "Smolder",
          #         "aliases": ["斯莫", "小龙"],
          #         "description": "来自英雄联盟的龙族少年。",
          #         "tags": ["LoL", "龙", "兽人", "火焰"]
          #     }
          # }
          #
          # 键名必须与 GitHub 中的角色文件夹名称完全对应。
          # ---------------------------------------------------------

          metadata = {}

          if os.path.isfile(metadata_file):
              with open(
                  metadata_file,
                  "r",
                  encoding="utf-8"
              ) as file:
                  metadata = json.load(file)

              if not isinstance(metadata, dict):
                  raise ValueError(
                      "characters.json 必须是 JSON 对象。"
                  )

          characters = []
          folders = []

          for name in os.listdir(root):
              path = os.path.join(root, name)

              if not os.path.isdir(path):
                  continue

              if name in ignored_folders:
                  continue

              if name.startswith("."):
                  continue

              folders.append(name)

          folders.sort(key=lambda x: x.lower())

          for character_id in folders:
              character_path = os.path.join(
                  root,
                  character_id
              )

              images = []

              for filename in os.listdir(character_path):
                  filepath = os.path.join(
                      character_path,
                      filename
                  )

                  if not os.path.isfile(filepath):
                      continue

                  if not is_image(filename):
                      continue

                  images.append(filename)

              images.sort(key=image_sort_key)

              if not images:
                  continue

              image_paths = []

              for filename in images:
                  # 使用正斜杠，保证 GitHub Pages / 浏览器路径兼容。
                  image_paths.append(
                      character_id + "/" + filename
                  )

              # 如果没有填写角色资料，就使用文件夹名作为默认名称。
              info = metadata.get(character_id, {})

              if not isinstance(info, dict):
                  info = {}

              name = info.get("name", character_id)
              name_en = info.get("name_en", "")
              aliases = info.get("aliases", [])
              description = info.get("description", "")
              tags = info.get("tags", [])

              # 防止 JSON 中误填字符串导致网页处理异常。
              if not isinstance(aliases, list):
                  aliases = [str(aliases)] if aliases else []

              if not isinstance(tags, list):
                  tags = [str(tags)] if tags else []

              characters.append({
                  "id": character_id,
                  "name": str(name),
                  "name_en": str(name_en),
                  "aliases": [str(x) for x in aliases],
                  "description": str(description),
                  "tags": [str(x) for x in tags],
                  "images": image_paths
              })

          data = {
              "characters": characters
          }

          with open(
              output_file,
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  data,
                  file,
                  ensure_ascii=False,
                  indent=4
              )
              file.write("\n")

          total_characters = len(characters)
          total_images = sum(
              len(character["images"])
              for character in characters
          )

          print("===================================")
          print("Gallery JSON generated.")
          print(f"Characters: {total_characters}")
          print(f"Images: {total_images}")
          print("===================================")

      - name: Commit gallery.json
        run: |
          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add gallery.json

          if git diff --cached --quiet; then
            echo "gallery.json is already up to date."
          else
            git commit \
              -m "Auto update gallery.json"

            git push
          fi
